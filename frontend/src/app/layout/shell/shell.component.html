<!--
  Ambient layers, mounted once at the shell root and behind everything.
  Both are pointer-events: none and pause when the tab is hidden.
-->
<app-aurora-background />
<app-cursor-glow />

@if (navigating()) {
  <app-ai-loader
    [label]="navigatingLabel() ?? 'Loading'"
    [caption]="navigatingLabel() ? 'Opening this screen' : ''"
    icon="pi pi-compass"
  />
}

<div class="shell" [class.shell--collapsed]="sidebarStore.collapsed()" [class.shell--compact]="compact()">
  <app-topbar class="shell__topbar" />
  <app-sidebar class="shell__sidebar" />

  <main
    class="shell__content"
    [@routeFade]="routeKey()"
    [@.disabled]="reducedMotion.prefersReduced()"
    (scroll)="onContentScroll($event)"
  >
    <router-outlet />
  </main>
</div>
