<div class="change-password">
  <div class="change-password__card glass-card glass-card--static">
    <div class="change-password__head">
      <i class="pi pi-shield"></i>
      <h1>Set a new password</h1>
      <p>Your account is still on a temporary password. Choose your own before continuing.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <label class="field">
        <span class="field-label">Current (temporary) password</span>
        <p-password formControlName="currentPassword" [feedback]="false" [toggleMask]="true" autocomplete="current-password" />
      </label>

      <label class="field">
        <span class="field-label">New password</span>
        <p-password formControlName="newPassword" [feedback]="true" [toggleMask]="true" autocomplete="new-password" />
        <span class="field-hint">At least 6 characters.</span>
      </label>

      <label class="field">
        <span class="field-label">Confirm new password</span>
        <p-password formControlName="confirmPassword" [feedback]="false" [toggleMask]="true" autocomplete="new-password" />
      </label>

      @if (formError()) {
        <div class="modal-error">
          <i class="pi pi-exclamation-circle"></i>
          <span>{{ formError() }}</span>
        </div>
      }

      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        @if (saving()) {
          <span class="btn-spinner"></span>
        } @else {
          <i class="pi pi-check"></i>
        }
        <span>Set password &amp; continue</span>
      </button>
    </form>
  </div>
</div>
