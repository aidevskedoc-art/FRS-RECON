<div style="display:flex;flex-direction:column;gap:1rem;">
  <div style="display:flex;align-items:center;gap:8px;">
    <h2 style="margin:0;font-size:1.05rem;line-height:normal;">PayU MPR Batches</h2>
    <i
      class="pi pi-info-circle page-info"
      style="font-size:0.85rem;color:var(--text-subtle);cursor:help;"
      pTooltip="Gateway settlement reports. A gateway-UPI receipt reconciles against these rows."
      tooltipPosition="bottom"
      tabindex="0"
    ></i>
  </div>

  @if (error(); as err) {
    <div class="notice notice--danger" style="padding:.75rem 1rem;border-radius:8px;">
      <i class="pi pi-times-circle"></i> {{ err }}
    </div>
  }

  <p-table
    [value]="bankStatements.mprBatches()"
    styleClass="p-datatable-sm"
    [scrollable]="true"
    [paginator]="true"
    [rows]="25"
    [rowsPerPageOptions]="[10, 25, 50, 100]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first} – {last} of {totalRecords}"
  >
    <ng-template #header>
      <tr>
        <th>File</th>
        <th>Rows</th>
        <th>Period</th>
        <th>Uploaded</th>
        <th style="width:8rem;"></th>
      </tr>
    </ng-template>
    <ng-template #body let-batch>
      <tr>
        <td>{{ batch.fileName }}</td>
        <td>{{ batch.rowCount }}</td>
        <td>{{ batch.statementFrom || '—' }} → {{ batch.statementTo || '—' }}</td>
        <td>{{ batch.uploadedAt ? (batch.uploadedAt | date: 'medium') : '—' }}</td>
        <td style="white-space:nowrap;">
          <button type="button" class="action-icon" (click)="viewRecords(batch.id)" pTooltip="View rows">
            <i class="pi pi-eye"></i>
          </button>
          <button
            type="button"
            class="action-icon action-icon--danger"
            [disabled]="deletingId() === batch.id"
            (click)="deleteBatch(batch.id)"
            pTooltip="Delete"
          >
            <i class="pi pi-trash"></i>
          </button>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-tertiary);">No PayU MPR uploaded yet.</td></tr>
    </ng-template>
  </p-table>
</div>
