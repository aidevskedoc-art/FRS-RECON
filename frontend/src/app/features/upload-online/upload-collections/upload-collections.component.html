<div class="upload-hub">
  <div class="page-header">
    <h2>Upload Collection Reports</h2>
    <p>MIS payment data, cheque collections and the refund document — pick a report and drop the file.</p>
  </div>

  <div class="hub-picker" role="tablist">
    @for (tab of tabs; track tab.id) {
      <button
        type="button"
        role="tab"
        class="hub-option"
        [class.hub-option--active]="active() === tab.id"
        [attr.aria-selected]="active() === tab.id"
        (click)="select(tab.id)"
      >
        <span class="hub-option__title">{{ tab.label }}</span>
        <span class="hub-option__hint">{{ tab.hint }}</span>
      </button>
    }
  </div>

  <div class="hub-panel">
    @switch (active()) {
      @case ('mis') { <app-upload-mis [embedded]="true" /> }
      @case ('cheque') { <app-upload-cheque-collection [embedded]="true" /> }
      @case ('refund') { <app-upload-refund-document [embedded]="true" /> }
    }
  </div>
</div>
